name: Windows Build

on:
  push:
    branches: [main, improvement, feature/windows-support]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci

      - name: Jest tests
        run: npx jest __tests__/windows --passWithNoTests

      - name: Enable sideloading
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - name: Bundle JS for Windows
        shell: pwsh
        run: npx react-native bundle --platform windows --dev false --entry-file index.js --bundle-output "$env:RUNNER_TEMP\index.windows.bundle"

      - name: Build and deploy
        shell: pwsh
        run: |
          $attempts = 0
          $success = $false
          while ($attempts -lt 2 -and -not $success) {
            $attempts++
            npx react-native run-windows --release --arch x64 --no-packager --no-launch --singleproc --deploy-from-layout --no-telemetry --logging
            if ($LASTEXITCODE -eq 0) { $success = $true }
            elseif ($attempts -lt 2) { Write-Host "Build failed, retrying..." }
          }
          if (-not $success) { exit 1 }

      - name: Build and sign MSIX package
        shell: pwsh
        run: |
          msbuild windows\FreeKiosk.sln /p:Configuration=Release /p:Platform=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Always /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /restore /v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=FreeKiosk" -KeyUsage DigitalSignature -FriendlyName "FreeKiosk Test" -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "FreeKiosk" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath ".\FreeKioskTestCert.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath ".\FreeKioskTestCert.cer" | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { $_.Directory.Name } -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          $bundle = Get-ChildItem -Recurse windows\FreeKiosk.Package\AppPackages\*.msixbundle | Select-Object -First 1 -ExpandProperty FullName
          if (-not $bundle) { Write-Error "msixbundle not found"; exit 1 }
          Copy-Item $bundle ".\TransKIOSK.msixbundle"
          & $signtool sign /fd SHA256 /a /f ".\FreeKioskTestCert.pfx" /p "FreeKiosk" ".\TransKIOSK.msixbundle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: MDM smoke test
        shell: pwsh
        run: ./scripts/windows-mdm-smoke.ps1 -CertPath .\FreeKioskTestCert.cer -PfxPath .\FreeKioskTestCert.pfx -PfxPassword FreeKiosk

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TransKIOSK-Windows-smoke
          path: |
            smoke-screenshot.jpg
            smoke-stream.bin
          if-no-files-found: warn

      - name: Write install instructions
        shell: pwsh
        run: |
          @'
          #Requires -RunAsAdministrator
          # Installs the TransKIOSK test certificate and app package.
          Import-Certificate -FilePath "$PSScriptRoot\FreeKioskTestCert.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople
          Add-AppxPackage -Path "$PSScriptRoot\TransKIOSK.msixbundle"
          Write-Host "Installed. Launch 'TransKIOSK' from Start."
          '@ | Set-Content -Encoding utf8 .\Install.ps1
          @'
          # TransKIOSK for Windows (test build)

          If Install.ps1 says "not digitally signed", the PowerShell execution
          policy is blocking unsigned scripts. Either unblock it:

            Unblock-File .\Install.ps1 ; .\Install.ps1
            # or: powershell -ExecutionPolicy Bypass -File .\Install.ps1

          Or run what the script does yourself in ADMINISTRATOR PowerShell:

            Import-Certificate -FilePath .\FreeKioskTestCert.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
            Add-AppxPackage -Path .\TransKIOSK.msixbundle

          Then launch "TransKIOSK" from the Start menu.

          Requires: Windows 10 1809+ or Windows 11, sideloading or Developer Mode enabled.

          ## Uninstall / revert

          Run in ADMINISTRATOR PowerShell:

            # Remove the app (or Settings -> Apps -> TransKIOSK -> Uninstall)
            Remove-AppxPackage -Package (Get-AppxPackage -Name FreeKiosk).PackageFullName

            # Remove the test certificate
            Get-ChildItem Cert:\LocalMachine\TrustedPeople |
              Where-Object Subject -eq "CN=FreeKiosk" | Remove-Item

            # Only if you ran Set-ExecutionPolicy earlier: restore the default
            Set-ExecutionPolicy Restricted

          Note: Unblock-File and "powershell -ExecutionPolicy Bypass -File" are
          per-file / per-process and leave nothing behind to revert.
          '@ | Set-Content -Encoding utf8 .\README-Windows.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TransKIOSK-Windows-x64
          path: |
            TransKIOSK.msixbundle
            FreeKioskTestCert.cer
            FreeKioskTestCert.pfx
            Install.ps1
            README-Windows.txt
          if-no-files-found: error
